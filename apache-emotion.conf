# Apache Configuration for E-MOTION
# Apache on port 9000, Node.js on port 3000
# 
# Installation steps:
# 1. sudo a2enmod proxy proxy_http headers rewrite
# 2. sudo cp apache-emotion.conf /etc/apache2/sites-available/emotion.conf
# 3. sudo a2ensite emotion.conf
# 4. Edit /etc/apache2/ports.conf and ensure exactly one: Listen 9000
# 5. sudo apache2ctl configtest
# 6. sudo systemctl reload apache2

<VirtualHost *:9000>
    ServerAdmin webmaster@localhost
    ServerName yourdomain.com

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/emotion-error.log
    CustomLog ${APACHE_LOG_DIR}/emotion-access.log combined

    # Proxy to Node.js app running on port 3000
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Forward headers
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "9000"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    # Timeouts
    ProxyTimeout 300
    TimeOut 300
</VirtualHost>
